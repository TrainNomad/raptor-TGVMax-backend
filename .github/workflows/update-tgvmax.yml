name: Update TGVmax Data

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  update-tgvmax:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Récupération ultra-rapide du code ─────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # ⚡ Économie de bande passante et historique propre

      # ── 2. Configuration Node.js ─────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # ⚡ CORRECTION : On passe de '20' à '22' (ou '24')
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci # Utilise la version lock pour aller beaucoup plus vite
          fi

      # ── 3. Téléchargement de stations.csv (pour les coordonnées GPS) ─────────
      - name: Download stations.csv
        run: |
          curl -fsSL "https://raw.githubusercontent.com/trainline-eu/stations/master/stations.csv" -o stations.csv
          echo "✅ stations.csv prêt"

      # ── 4. Ingestion + construction de l'index des gares ─────────────────────
      - name: Run Build (ingest + stations index)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # ── 5. Envoi direct sur Supabase Storage (Aucun push Git volumineux !) ──
      - name: Upload data to Supabase Storage
        run: node upload.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}